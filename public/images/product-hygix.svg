<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f9ff"/>
      <stop offset="100%" style="stop-color:#e0f2fe"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="24"/>
  <!-- Toilet Cleaner Bottle -->
  <g transform="translate(140, 60)">
    <!-- Cap -->
    <rect x="20" y="10" width="60" height="35" rx="6" fill="#1d4ed8"/>
    <rect x="35" y="0" width="30" height="15" rx="4" fill="#1e40af"/>
    <!-- Neck -->
    <rect x="30" y="42" width="40" height="15" rx="3" fill="#1d4ed8"/>
    <!-- Body -->
    <rect x="5" y="55" width="90" height="180" rx="20" fill="url(#bottle)"/>
    <!-- Label area -->
    <rect x="15" y="90" width="70" height="70" rx="8" fill="white" opacity="0.15"/>
    <!-- Text on bottle -->
    <text x="50" y="120" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="white" letter-spacing="1">HYGI-X</text>
    <text x="50" y="138" text-anchor="middle" font-family="sans-serif" font-size="8" fill="white" opacity="0.8">500ml</text>
    <!-- Decorative lines -->
    <line x1="20" y1="170" x2="80" y2="170" stroke="white" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
    <line x1="25" y1="185" x2="75" y2="185" stroke="white" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
    <line x1="30" y1="196" x2="70" y2="196" stroke="white" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
    <!-- Spray decoration -->
    <circle cx="80" cy="25" r="3" fill="#93c5fd" opacity="0.6"/>
    <circle cx="90" cy="18" r="2" fill="#93c5fd" opacity="0.5"/>
    <circle cx="75" cy="15" r="2" fill="#93c5fd" opacity="0.5"/>
  </g>
  <!-- Floor reflection -->
  <ellipse cx="200" cy="330" rx="80" ry="8" fill="#2563eb" opacity="0.08"/>
  <!-- Product name bottom -->
  <text x="200" y="370" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2563eb">HYGI-X</text>
  <text x="200" y="390" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">Toilet Cleaner · 500ml · ₹99</text>
</svg>
