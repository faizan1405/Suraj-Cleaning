<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f9ff"/>
      <stop offset="100%" style="stop-color:#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="24"/>
  <!-- Delivery truck -->
  <rect x="60" y="170" width="200" height="100" rx="12" fill="#2563eb" opacity="0.2"/>
  <rect x="60" y="210" width="60" height="60" rx="4" fill="#1d4ed8" opacity="0.2"/>
  <!-- Truck cab -->
  <rect x="260" y="200" width="80" height="70" rx="8" fill="#2563eb" opacity="0.15"/>
  <rect x="270" y="210" width="55" height="35" rx="4" fill="white" opacity="0.3"/>
  <!-- Wheels -->
  <circle cx="110" cy="270" r="22" fill="#1e293b" opacity="0.2"/>
  <circle cx="110" cy="270" r="10" fill="#334155" opacity="0.3"/>
  <circle cx="280" cy="270" r="22" fill="#1e293b" opacity="0.2"/>
  <circle cx="280" cy="270" r="10" fill="#334155" opacity="0.3"/>
  <circle cx="330" cy="270" r="22" fill="#1e293b" opacity="0.2"/>
  <circle cx="330" cy="270" r="10" fill="#334155" opacity="0.3"/>
  <!-- Road -->
  <rect x="40" y="290" width="320" height="6" rx="3" fill="#94a3b8" opacity="0.3"/>
  <!-- Speed lines -->
  <line x1="30" y1="200" x2="50" y2="200" stroke="#2563eb" stroke-width="3" opacity="0.2" stroke-linecap="round"/>
  <line x1="20" y1="220" x2="45" y2="220" stroke="#2563eb" stroke-width="3" opacity="0.2" stroke-linecap="round"/>
  <line x1="30" y1="240" x2="50" y2="240" stroke="#2563eb" stroke-width="3" opacity="0.2" stroke-linecap="round"/>
  <!-- Clock/Time -->
  <circle cx="330" cy="120" r="30" fill="#2563eb" opacity="0.1" stroke="#2563eb" stroke-width="2"/>
  <line x1="330" y1="120" x2="330" y2="100" stroke="#2563eb" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <line x1="330" y1="120" x2="345" y2="125" stroke="#2563eb" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <text x="200" y="340" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">On Time Delivery</text>
</svg>
