<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdf4ff"/>
      <stop offset="100%" style="stop-color:#fae8ff"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)" rx="16"/>
  <!-- Toilet illustration -->
  <rect x="200" y="80" width="200" height="200" rx="20" fill="#f3e8ff" opacity="0.6"/>
  <rect x="220" y="100" width="160" height="140" rx="12" fill="#e9d5ff" opacity="0.5"/>
  <ellipse cx="300" cy="160" rx="50" ry="40" fill="#2563eb" opacity="0.3"/>
  <!-- Water drops -->
  <ellipse cx="260" cy="120" rx="6" ry="8" fill="#3b82f6" opacity="0.5"/>
  <ellipse cx="340" cy="130" rx="5" ry="7" fill="#3b82f6" opacity="0.4"/>
  <ellipse cx="280" cy="200" rx="4" ry="6" fill="#3b82f6" opacity="0.5"/>
  <!-- Clean badge -->
  <rect x="240" y="260" width="120" height="36" rx="18" fill="#2563eb" opacity="0.15"/>
  <text x="300" y="284" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">99% Clean</text>
  <text x="300" y="370" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#7c3aed">Bathroom Care</text>
</svg>
