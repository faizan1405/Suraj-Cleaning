<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff"/>
      <stop offset="100%" style="stop-color:#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)" rx="16"/>
  <!-- Washing machine -->
  <rect x="180" y="80" width="240" height="240" rx="16" fill="white" opacity="0.8"/>
  <circle cx="300" cy="185" r="75" fill="#2563eb" opacity="0.1" stroke="#2563eb" stroke-width="2"/>
  <circle cx="300" cy="185" r="50" fill="#2563eb" opacity="0.08"/>
  <circle cx="300" cy="185" r="20" fill="#2563eb" opacity="0.15"/>
  <!-- Control knobs -->
  <circle cx="220" cy="100" r="8" fill="#94a3b8" opacity="0.5"/>
  <circle cx="380" cy="100" r="8" fill="#94a3b8" opacity="0.5"/>
  <!-- Foam bubbles -->
  <circle cx="150" cy="200" r="15" fill="white" opacity="0.5"/>
  <circle cx="140" cy="185" r="10" fill="white" opacity="0.4"/>
  <circle cx="460" cy="200" r="12" fill="white" opacity="0.5"/>
  <circle cx="470" cy="185" r="8" fill="white" opacity="0.4"/>
  <!-- Laundry icon -->
  <rect x="250" y="280" width="100" height="20" rx="4" fill="#2563eb" opacity="0.2"/>
  <text x="300" y="370" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2563eb">Laundry Care</text>
</svg>
