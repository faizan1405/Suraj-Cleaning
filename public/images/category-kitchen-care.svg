<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff7ed"/>
      <stop offset="100%" style="stop-color:#ffedd5"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)" rx="16"/>
  <!-- Dish/Sink area -->
  <rect x="150" y="100" width="300" height="180" rx="12" fill="#fff" opacity="0.7"/>
  <rect x="170" y="120" width="120" height="100" rx="8" fill="#fed7aa" opacity="0.4"/>
  <rect x="310" y="120" width="120" height="100" rx="8" fill="#fed7aa" opacity="0.4"/>
  <!-- Soap bubbles -->
  <circle cx="220" cy="160" r="12" fill="white" opacity="0.6"/>
  <circle cx="235" cy="148" r="8" fill="white" opacity="0.5"/>
  <circle cx="205" cy="148" r="8" fill="white" opacity="0.5"/>
  <circle cx="360" cy="160" r="10" fill="white" opacity="0.6"/>
  <circle cx="375" cy="150" r="7" fill="white" opacity="0.5"/>
  <!-- Sponge -->
  <rect x="250" y="200" width="100" height="30" rx="8" fill="#fb923c" opacity="0.5"/>
  <circle cx="270" cy="200" r="4" fill="#f97316" opacity="0.6"/>
  <circle cx="290" cy="203" r="3" fill="#f97316" opacity="0.6"/>
  <circle cx="310" cy="199" r="4" fill="#f97316" opacity="0.6"/>
  <circle cx="330" cy="202" r="3" fill="#f97316" opacity="0.6"/>
  <!-- Sparkle -->
  <circle cx="450" cy="120" r="5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="130" cy="300" r="4" fill="#fbbf24" opacity="0.5"/>
  <text x="300" y="370" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ea580c">Kitchen Care</text>
</svg>
