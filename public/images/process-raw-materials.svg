<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7"/>
      <stop offset="100%" style="stop-color:#fde68a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="24"/>
  <!-- Raw materials -->
  <circle cx="150" cy="160" r="50" fill="#f59e0b" opacity="0.2"/>
  <circle cx="250" cy="160" r="50" fill="#10b981" opacity="0.2"/>
  <circle cx="200" cy="240" r="50" fill="#2563eb" opacity="0.2"/>
  <!-- Leaves / nature -->
  <ellipse cx="140" cy="140" rx="30" ry="15" fill="#22c55e" opacity="0.4" transform="rotate(-30 140 140)"/>
  <ellipse cx="260" cy="140" rx="30" ry="15" fill="#22c55e" opacity="0.4" transform="rotate(30 260 140)"/>
  <ellipse cx="200" cy="260" rx="30" ry="15" fill="#22c55e" opacity="0.4"/>
  <!-- Droplets -->
  <ellipse cx="170" cy="180" rx="8" ry="10" fill="#3b82f6" opacity="0.3"/>
  <ellipse cx="230" cy="180" rx="8" ry="10" fill="#3b82f6" opacity="0.3"/>
  <text x="200" y="340" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#92400e">Raw Materials</text>
</svg>
