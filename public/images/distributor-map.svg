<svg viewBox="0 0 400 380" className="w-full max-w-[420px]" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#1d4ed8"/>
      <stop offset="100%" stopColor="#60a5fa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lineGlow">
      <feGaussianBlur stdDeviation="1.5" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="centerGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.25"/>
      <stop offset="100%" stopColor="#ffffff" stopOpacity="0"/>
    </radialGradient>
  </defs>

  {/* Background */}
  <rect width="400" height="380" fill="url(#bg)" rx="16"/>

  {/* Subtle dotted pattern overlay */}
  <pattern id="dots" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="0.8" fill="white" opacity="0.08"/>
  </pattern>
  <rect width="400" height="380" fill="url(#dots)" rx="16"/>

  {/* Top-right corner dot grid pattern */}
  <g opacity="0.12">
    {[...Array(6)].map((_, row) =>
      [...Array(8)].map((_, col) => (
        <circle key={`${row}-${col}`} cx={340 + col * 8} cy={10 + row * 8} r="2" fill="white"/>
      ))
    )}
  </g>

  {/* Bottom-left corner dot grid pattern */}
  <g opacity="0.12">
    {[...Array(5)].map((_, row) =>
      [...Array(6)].map((_, col) => (
        <circle key={`bl-${row}-${col}`} cx={8 + col * 8} cy={310 + row * 8} r="2" fill="white"/>
      ))
    )}
  </g>

  {/* Center glow */}
  <circle cx="270" cy="280" r="50" fill="url(#centerGlow)"/>

  {/* Stylized map shape - India-like outline with puzzle segments */}
  <g opacity="0.2">
    {/* Northern region */}
    <path d="M260 140 L285 130 L310 125 L330 135 L340 155 L325 170 L305 175 L285 165 L265 170 L250 160 Z" fill="white" stroke="white" strokeWidth="0.5"/>
    {/* Northwestern region */}
    <path d="M230 170 L250 160 L265 170 L285 165 L280 185 L260 195 L240 190 L225 180 Z" fill="white" stroke="white" strokeWidth="0.5"/>
    {/* Western region */}
    <path d="M225 180 L240 190 L260 195 L255 215 L235 225 L215 215 L210 195 Z" fill="white" stroke="white" strokeWidth="0.5"/>
    {/* Central region */}
    <path d="M260 195 L285 185 L305 175 L310 190 L295 210 L275 215 L255 215 Z" fill="white" stroke="white" strokeWidth="0.5"/>
    {/* Central-south region */}
    <path d="M255 215 L275 215 L295 210 L290 235 L270 245 L250 240 L240 225 Z" fill="white" stroke="white" strokeWidth="0.5"/>
    {/* Eastern region */}
    <path d="M305 175 L325 170 L340 180 L345 200 L325 210 L310 190 Z" fill="white" stroke="white" strokeWidth="0.5"/>
    {/* Southern region */}
    <path d="M250 240 L270 245 L275 265 L255 280 L235 275 L240 255 Z" fill="white" stroke="white" strokeWidth="0.5"/>
    {/* Southeastern region */}
    <path d="M270 245 L290 235 L300 255 L285 270 L275 265 Z" fill="white" stroke="white" strokeWidth="0.5"/>
  </g>

  {/* Map outline (more visible) */}
  <g opacity="0.35" stroke="white" strokeWidth="1.2" fill="none">
    <path d="M280 125 L310 118 L335 130 L350 155 L345 180 L360 200 L355 225 L340 240 L320 250 L300 255 L285 275 L265 290 L250 295 L240 275 L235 255 L240 235 L250 220 L255 195 L240 175 L225 165 L220 180 L210 195 L215 215 L235 230 L250 240 L255 215 L275 210 L295 200 L305 185 L295 165 L280 165 L265 175 L250 165 L245 150 L260 140 L280 125 Z"/>
    {/* Internal borders */}
    <path d="M250 165 L275 170 L295 165"/>
    <path d="M240 195 L260 195 L280 185"/>
    <path d="M255 215 L275 215 L290 235"/>
    <path d="M250 240 L270 245 L275 265"/>
    <path d="M305 175 L310 190 L325 200"/>
  </g>

  {/* Map body with blue gradient */}
  <g opacity="0.25">
    <path d="M275 130 L308 122 L333 135 L345 160 L338 182 L355 202 L348 228 L335 242 L315 252 L298 258 L282 278 L262 292 L248 298 L238 278 L232 258 L238 238 L248 222 L253 198 L238 178 L223 168 L218 183 L208 198 L213 218 L233 232 L248 242 L253 218 L273 212 L293 202 L303 188 L293 168 L278 168 L263 178 L248 168 L243 152 L258 142 L275 130 Z" fill="#2563eb" stroke="none"/>
  </g>

  {/* Distribution connection lines */}
  <g filter="url(#lineGlow)">
    {/* Line 1: top pin to center */}
    <path d="M315 155 Q300 220 270 275" stroke="white" strokeWidth="1.5" fill="none" opacity="0.5" strokeDasharray="4 3"/>
    {/* Line 2: top-left pin to center */}
    <path d="M285 170 Q275 215 270 275" stroke="white" strokeWidth="1.5" fill="none" opacity="0.5" strokeDasharray="4 3"/>
    {/* Line 3: left pin to center */}
    <path d="M245 200 Q250 230 265 275" stroke="white" strokeWidth="1.5" fill="none" opacity="0.5" strokeDasharray="4 3"/>
    {/* Line 4: bottom-left pin to center */}
    <path d="M255 265 Q255 270 270 278" stroke="white" strokeWidth="1.5" fill="none" opacity="0.5" strokeDasharray="4 3"/>
    {/* Line 5: bottom pin to center */}
    <path d="M295 280 Q285 278 272 278" stroke="white" strokeWidth="1.5" fill="none" opacity="0.5" strokeDasharray="4 3"/>
    {/* Line 6: right pin to center */}
    <path d="M335 210 Q310 240 278 280" stroke="white" strokeWidth="1.5" fill="none" opacity="0.5" strokeDasharray="4 3"/>
  </g>

  {/* Center hub */}
  <g filter="url(#glow)">
    <circle cx="270" cy="278" r="12" fill="#2563eb" stroke="white" strokeWidth="2" opacity="0.9"/>
    <circle cx="270" cy="278" r="5" fill="white" opacity="0.9"/>
  </g>

  {/* Location pins */}
  {/* Pin 1 - Top */}
  <g filter="url(#glow)">
    <circle cx="315" cy="150" r="10" fill="#2563eb" stroke="white" strokeWidth="2"/>
    <circle cx="315" cy="150" r="4" fill="white"/>
  </g>

  {/* Pin 2 - Top-left */}
  <g filter="url(#glow)">
    <circle cx="285" cy="165" r="10" fill="#2563eb" stroke="white" strokeWidth="2"/>
    <circle cx="285" cy="165" r="4" fill="white"/>
  </g>

  {/* Pin 3 - Left */}
  <g filter="url(#glow)">
    <circle cx="245" cy="195" r="10" fill="#2563eb" stroke="white" strokeWidth="2"/>
    <circle cx="245" cy="195" r="4" fill="white"/>
  </g>

  {/* Pin 4 - Bottom-left */}
  <g filter="url(#glow)">
    <circle cx="255" cy="260" r="10" fill="#2563eb" stroke="white" strokeWidth="2"/>
    <circle cx="255" cy="260" r="4" fill="white"/>
  </g>

  {/* Pin 5 - Bottom */}
  <g filter="url(#glow)">
    <circle cx="295" cy="275" r="10" fill="#2563eb" stroke="white" strokeWidth="2"/>
    <circle cx="295" cy="275" r="4" fill="white"/>
  </g>

  {/* Pin 6 - Right */}
  <g filter="url(#glow)">
    <circle cx="335" cy="205" r="10" fill="#2563eb" stroke="white" strokeWidth="2"/>
    <circle cx="335" cy="205" r="4" fill="white"/>
  </g>

  {/* Small decorative elements */}
  <circle cx="330" cy="130" r="3" fill="white" opacity="0.3"/>
  <circle cx="370" cy="150" r="2.5" fill="white" opacity="0.25"/>
  <circle cx="225" cy="250" r="2.5" fill="white" opacity="0.25"/>
  <circle cx="200" cy="300" r="3" fill="white" opacity="0.2"/>
  <circle cx="350" cy="290" r="2" fill="white" opacity="0.2"/>

  {/* Subtle corner accents */}
  <path d="M15 365 L15 340 L40 340" stroke="white" strokeWidth="1.5" fill="none" opacity="0.15"/>
</svg>
