<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7"/>
      <stop offset="100%" style="stop-color:#fde68a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="24"/>
  <g transform="translate(120, 50)">
    <!-- Powder box -->
    <rect x="10" y="40" width="100" height="120" rx="8" fill="#f59e0b" opacity="0.6"/>
    <rect x="20" y="50" width="80" height="50" rx="4" fill="white" opacity="0.2"/>
    <text x="60" y="82" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#78350f">SUPREME</text>
    <!-- Powder spill -->
    <ellipse cx="60" cy="170" rx="40" ry="8" fill="#fbbf24" opacity="0.5"/>
    <!-- Sparkles -->
    <circle cx="130" cy="60" r="4" fill="white" opacity="0.5"/>
    <circle cx="10" cy="30" r="3" fill="white" opacity="0.4"/>
  </g>
  <text x="200" y="330" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#78350f">SUPREME</text>
  <text x="200" y="355" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">Detergent Powder · 1kg · ₹109</text>
</svg>
