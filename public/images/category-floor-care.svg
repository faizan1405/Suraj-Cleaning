<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4"/>
      <stop offset="100%" style="stop-color:#dcfce7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)" rx="16"/>
  <!-- Floor plan illustration -->
  <rect x="80" y="60" width="440" height="260" rx="8" fill="#bbf7d0" opacity="0.4"/>
  <rect x="100" y="80" width="200" height="140" rx="4" fill="#86efac" opacity="0.3"/>
  <rect x="320" y="80" width="180" height="140" rx="4" fill="#86efac" opacity="0.3"/>
  <!-- Mop/Bucket -->
  <ellipse cx="200" cy="250" rx="35" ry="12" fill="#2563eb" opacity="0.7"/>
  <rect x="185" y="200" width="30" height="50" rx="4" fill="#3b82f6"/>
  <rect x="195" y="160" width="10" height="45" fill="#64748b"/>
  <ellipse cx="200" cy="158" rx="12" ry="5" fill="#94a3b8"/>
  <!-- Sparkles -->
  <circle cx="350" cy="180" r="4" fill="#fbbf24" opacity="0.7"/>
  <circle cx="420" cy="200" r="3" fill="#fbbf24" opacity="0.6"/>
  <circle cx="380" cy="230" r="5" fill="#fbbf24" opacity="0.5"/>
  <circle cx="450" cy="250" r="3" fill="#fbbf24" opacity="0.7"/>
  <!-- Text -->
  <text x="300" y="370" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#16a34a">Floor Care</text>
</svg>
